            <div class="player-buttons">

              <button class="player-btn play-btn" id="player-play-btn" aria-label="Play / Pause"><i class="fas fa-play"></i></button>
              <button class="player-btn" id="player-next-btn" aria-label="Next Track"><i class="fas fa-forward"></i></button>
            </div>

            <div class="player-volume-wrapper">
